name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "24", "lts/*"]
    name: ci (node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - run: node --version && bun --version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Test (node runtime)
        if: matrix.node != '24'
        run: bun run test:unit
      - name: Test with coverage thresholds (node runtime)
        if: matrix.node == '24'
        run: bun run coverage
      - name: Test (bun runtime)
        run: bun run test:bun
      - name: Build
        run: bun run build
      - name: Pack
        run: npm pack --dry-run
      - name: Package lint
        run: bunx publint && bunx attw --pack . --profile esm-only
      - name: Smoke (node)
        run: node -e "import('./dist/index.mjs').then(m => { if (m.slugify('Hello World') !== 'hello-world') process.exit(1) })"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Smoke (deno)
        run: |
          deno eval "import { slugify } from './dist/index.mjs'; import { resolveUri } from './dist/uri.mjs'; import { transliterate, hangul } from './dist/transliterate.mjs'; if (slugify('Hello World') !== 'hello-world' || resolveUri('http://a/b/c/d;p?q', '../../g') !== 'http://a/g' || transliterate('서울', { tables: [hangul] }) !== 'seoul') Deno.exit(1)"
      - name: Smoke (bun)
        run: bun -e "import { slugify } from './dist/index.mjs'; import { resolveUri } from './dist/uri.mjs'; if (typeof Bun === 'undefined' || slugify('Hello World') !== 'hello-world' || resolveUri('http://a/b/c/d;p?q', '../../g') !== 'http://a/g') process.exit(1)"
