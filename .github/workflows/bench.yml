name: Bench

permissions:
  contents: read
  actions: read

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"
  pull_request:
    paths:
      - "src/**"
      - "bench/**"

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Bench
        run: bunx vitest bench --run --outputJson bench/results.json
      - name: Fetch the last successful run on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh run list --workflow bench.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$id" ]; then gh run download "$id" --name bench-results --dir bench/previous || true; fi
      - name: Compare
        run: |
          if [ -f bench/previous/results.json ]; then
            node bench/compare.mjs bench/results.json bench/previous/results.json
          else
            echo "no previous successful run to compare with" >> "$GITHUB_STEP_SUMMARY"
            node bench/compare.mjs bench/results.json bench/results.json
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench/results.json
